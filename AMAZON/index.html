<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>AMAZZZON</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="./assets/logo.png" alt="">
        </div>
        <div class="navbar">
            <ul>
                <li><a href="#">All</a></li>
                <li><a href="#">Today's deals</a></li>
                <li><a href="#">Customer Service</a></li>
                <li><a href="#">Registry</a></li>
                <li><a href="#">Gift Cards</a></li>
                <li><a href="#">Sell</a></li>
            </ul>
        </div>
    </header>

    <main>
        <section class="giftCard">
            <p>Shop All Holiday Gift Cards</p>
            <div class="giftGuides">
                <h1>Holiday Gift Guides</h1>
                <h4>Be a go-gifter</h4>
            </div>
        </section>

        <section class="carousel">
            <div class="shopButton">
                <p>Find the perfect gift</p>
                <a href="#">Shop Now</a>
            </div>
            <div class="carImg">
                <div class="imgItem">
                    <img class="immagine" src="/assets/img_1.jpg" alt="">
                </div>
                <div class="imgItem">
                    <img class="immagine" src="/assets/img_2.jpg" alt="">
                </div>
                <div class="imgItem">
                    <img class="immagine" src="/assets/img_3.jpg" alt="">
                </div>
                <div class="imgItem">
                    <img class="immagine" src="/assets/img_4.jpg" alt="">
                </div>
            </div>

        </section>

        <section class="table">
            <!-- Questo è un commento in HTML -->
            <figure class="figure1">
                <img
                    src="/assets/img_9.png"
                    alt="Elephant at sunset" />
                <figcaption class="figcaption1">
                    <p>Play the gifting game</p>
                    <a href="#">Shop gaming</a>
                </figcaption>
            </figure>


        </section>

        <section class="table">
            <!-- Questo è un commento in HTML -->
            <figure class="figure1">
                <img
                    src="/assets/img_10.png"
                    alt="Elephant at sunset" />
                <figcaption class="figcaption1">
                    <p>the sound of cheer</p>
                    <a href="#">Shop audio & Accessories</a>
                </figcaption>
            </figure>


        </section>

        <section class="backTOP">
            <a href="#">Back to top</a>
        </section>
    </main>

    <footer>
        <img src="/assets/logo.png" alt="">
    </footer>
    
</body>
</html>
